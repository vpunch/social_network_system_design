openapi: 3.0.4
info:
  title: Social network for travelers
  description: |-
    This is a high-level API
  contact:
    email: rot1tweiler@gmail.com
  version: 0.1.1
servers:
  - url: https://petstore3.swagger.io/api/v3
tags:
  - name: article
    description: Operations on posts of users
  - name: subscription
    description: Operations on user subscriptions to other users' posts
  - name: reaction
    description: Operations on reactins to posts
  - name: comment
    description: Operations on comments to posts
  - name: location
    description: Operations on user locations
paths:
  /article:
    post:
      tags:
        - article
      summary: Add the article to users feed
      description: The client must encode the images in base64
      operationId: postArticle
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Article'
        required: true
      responses:
        '200':
          description: Successful operation
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags:
        - article
      summary: Get the articles from the user feed or the location
      description: Articles for the user will be returned based on his subscriptions
      operationId: getArticles
      parameters:
        - name: entity
          in: query
          description: Where to get articles from
          required: true
          schema:
            type: string
            enum:
              - user
              - location
        - name: id
          in: query
          description: Entity ID
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Articles"          
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /comment:
    post:
      tags:
        - comment
      summary: Add the comment to the article
      operationId: postComment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
        required: true
      responses:
        '200':
          description: Successful operation
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reaction:
    get:
      tags:
        - reaction
      summary: Get available reactions
      operationId: getReactions
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reactions" 
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags:
        - reaction
      summary: Attach the reaction to the comment
      description: Don't fill the icon field
      operationId: putReaction
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reaction'
        required: true
      responses:
        '200':
          description: Successful operation
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /subscription/{user_id}:
    put:
      tags:
        - subscription
      summary: Subscribe to user articles
      operationId: putSubscription
      parameters:
        - name: user_id
          in: path
          description: ID of the user to subscribe to
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /location:
    get:
      tags:
        - location
      summary: Get popular locations
      operationId: getLocations
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Locations" 
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
    Article:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        user_id:
          type: integer
          format: int64
          example: 10
        text:
          type: string
          example: "Hi. Today I visited St. Petersburg."
        images:
          type: array
          maxItems: 3
          items:
            type: string
            format: base64
        location:
          $ref: '#/components/schemas/Location'
    Articles:
      type: array
      items:
        $ref: '#/components/schemas/Article'
    Comment:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        article_id:
          type: integer
          format: int64
          example: 10
        text:
          type: string
          example: "What a wonderful place!"
    Reaction:
      type: object
      required:
        - article_id
        - user_id
        - code
      properties:
        article_id:
          type: integer
          format: int64
          example: 10
        user_id:
          type: integer
          format: int64
          example: 10
        code:
          type: string
          example: ':star:'
        icon:
          type: string
          format: base64
    Reactions:
      type: array
      items:
        $ref: '#/components/schemas/Reaction'
    Location:
      type: object
      properties:
        lat:
          type: integer
          format: int8
        lon:
          type: integer
          format: int8
    Locations:
      type: array
      items:
        $ref: '#/components/schemas/Location'
